<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FBFBFD" />
      <stop offset="100%" stop-color="#F0F2F5" />
    </radialGradient>

    <!-- Main Blue Gradient -->
    <linearGradient id="primaryBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#006699" />
    </linearGradient>

    <!-- Secondary Teal/Cyan Gradient -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#028090" />
    </linearGradient>

    <!-- Orange Gradient for Connectivity -->
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F26419" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>

    <!-- Soft Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0F2C59" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <g transform="translate(0, 20)">
    <!-- LOGO ICON GROUP -->
    <g filter="url(#dropShadow)">
      
      <!-- OPEN BOOK BASE -->
      <!-- Left Page -->
      <path d="M 400 370 C 330 335 240 330 160 360 L 160 250 C 240 220 330 225 400 260 Z" 
            fill="url(#primaryBlue)" />
      <!-- Left Page Detail/Highlight -->
      <path d="M 390 355 C 330 325 250 320 180 348 L 180 265 C 250 238 330 242 390 272 Z" 
            fill="#FFFFFF" opacity="0.15" />

      <!-- Right Page -->
      <path d="M 400 370 C 470 335 560 330 640 360 L 640 250 C 560 220 470 225 400 260 Z" 
            fill="url(#primaryBlue)" />
      <!-- Right Page Detail/Highlight -->
      <path d="M 410 355 C 470 325 550 320 620 348 L 620 265 C 550 238 470 242 410 272 Z" 
            fill="#FFFFFF" opacity="0.15" />

      <!-- Book Spine / Center Base -->
      <path d="M 400 370 L 400 260" stroke="#003366" stroke-width="4" stroke-linecap="round" />
      <path d="M 400 378 C 380 378 200 380 150 365 L 160 355 C 210 370 380 368 400 368 C 420 368 590 370 640 355 L 650 365 C 600 380 420 378 400 378 Z" 
            fill="url(#accentCyan)" />

      <!-- GLOBE & NETWORK (CONNECTIVITY) -->
      <!-- Outer Globe Sphere Lines -->
      <circle cx="400" cy="200" r="95" fill="none" stroke="url(#accentCyan)" stroke-width="3" opacity="0.4" />
      <ellipse cx="400" cy="200" rx="95" ry="38" fill="none" stroke="url(#accentCyan)" stroke-width="3" opacity="0.5" />
      <ellipse cx="400" cy="200" rx="38" ry="95" fill="none" stroke="url(#accentCyan)" stroke-width="3" opacity="0.5" />
      
      <!-- Network Nodes & Constellation Lines -->
      <!-- Lines -->
      <path d="M 340 160 L 400 130 L 460 170 L 440 230 L 360 240 L 340 160 Z" 
            fill="none" stroke="url(#accentOrange)" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 400 130 L 440 230 M 340 160 L 460 170 M 360 240 L 400 200 L 400 130" 
            fill="none" stroke="url(#accentOrange)" stroke-width="2" opacity="0.7" />

      <!-- Node Dots -->
      <circle cx="340" cy="160" r="6" fill="url(#accentOrange)" />
      <circle cx="400" cy="130" r="7" fill="url(#accentOrange)" />
      <circle cx="460" cy="170" r="6" fill="url(#accentOrange)" />
      <circle cx="440" cy="230" r="6.5" fill="url(#accentOrange)" />
      <circle cx="360" cy="240" r="5.5" fill="url(#accentOrange)" />
      <circle cx="400" cy="200" r="5" fill="#FFFFFF" stroke="#F26419" stroke-width="2" />

      <!-- Wi-Fi / Digital Signal Waves (Top Right) -->
      <g transform="translate(470, 105) rotate(-25)">
        <path d="M 0 30 A 35 35 0 0 1 50 30" fill="none" stroke="url(#accentCyan)" stroke-width="4.5" stroke-linecap="round" />
        <path d="M 10 38 A 22 22 0 0 1 40 38" fill="none" stroke="url(#accentCyan)" stroke-width="4" stroke-linecap="round" />
        <path d="M 20 46 A 10 10 0 0 1 30 46" fill="none" stroke="url(#accentCyan)" stroke-width="3.5" stroke-linecap="round" />
      </g>

      <!-- Graduation Cap Accent (Discreetly Integrated) -->
      <path d="M 400 90 L 435 105 L 400 120 L 365 105 Z" fill="url(#primaryBlue)" />
      <path d="M 435 105 L 435 125" stroke="url(#accentOrange)" stroke-width="2" stroke-linecap="round" />
      <circle cx="435" cy="127" r="2.5" fill="#F26419" />

    </g>

    <!-- TEXT SECTION -->
    <!-- Main Title: LEKOLPAM -->
    <text x="400" y="475" 
          font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', 'Roboto', sans-serif" 
          font-weight="900" 
          font-size="46" 
          fill="#0F2C59" 
          text-anchor="middle" 
          letter-spacing="3.5">
      LEKOL<tspan fill="#00A896">PAM</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="400" y="515" 
          font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif" 
          font-weight="500" 
          font-size="18" 
          fill="#556B82" 
          text-anchor="middle" 
          letter-spacing="2">
      Edikasyon ak Koneksyon pou Demen
    </text>

    <!-- Decorative Accent Line Below Text -->
    <rect x="360" y="540" width="80" height="4" rx="2" fill="url(#accentOrange)" />
  </g>
</svg>
